<!DOCTYPE html>
<html lang="it">
<head>
  <base href="/work-tracker-web/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Work Tracker: sessioni di lavoro, saldo ore e storico salvati localmente.">
  <meta name="theme-color" content="#355C66">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Work Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Work Tracker</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f6f7f9;
    }
  </style>
</head>
<body>
  <script>
    if ('storage' in navigator && 'persist' in navigator.storage) {
      navigator.storage.persist().catch(() => false);
    }

    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        const workerUrl = new URL('work_tracker_sw.js', document.baseURI);
        navigator.serviceWorker.register(workerUrl).catch(() => {});
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
